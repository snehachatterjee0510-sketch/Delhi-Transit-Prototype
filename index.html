<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi Bus Journey Planner</title>
<style>
  :root{
    --glass:rgba(255,255,255,.82); --text:#0f172a; --muted:#475569; --accent:#2563eb; --accent2:#1d4ed8;
    --chip:#dbeafe; --chipt:#1e40af; --border:rgba(255,255,255,.6);
  }
  body.dark{
    --glass:rgba(15,23,42,.78); --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --accent2:#60a5fa;
    --chip:#1e3a8a; --chipt:#dbeafe; --border:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);transition:color .3s}
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0b1d3a}
  .bg svg{width:100%;height:100%;display:block}
  .bg .dayonly{transition:opacity .6s} body.dark .bg .dayonly{opacity:0}
  .bg .nightonly{opacity:0;transition:opacity .6s} body.dark .bg .nightonly{opacity:1}
  .cloud{animation:drift 80s linear infinite} .cloud.c2{animation-duration:120s;animation-delay:-40s}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2300px)}}
  .bus{animation:drive 28s linear infinite}
  @keyframes drive{from{transform:translateX(-300px)}to{transform:translateX(2300px)}}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
  header{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4);gap:10px}
  header h1{font-size:clamp(22px,4vw,32px);margin:0}
  .icon-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);height:42px;padding:0 14px;border-radius:21px;white-space:nowrap}
  .card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:20px;margin-top:18px}
  label{font-size:13px;font-weight:600;color:var(--muted)}
  input,select{width:100%;padding:12px;margin:5px 0 12px;font-size:15px;border-radius:10px;border:1px solid rgba(100,116,139,.4);background:rgba(255,255,255,.9);color:#0f172a}
  input:focus,select:focus{outline:3px solid rgba(37,99,235,.35)}
  .row{display:flex;gap:10px;align-items:flex-end}.row>div{flex:1}
  .swap{flex:0 0 46px;height:46px;margin-bottom:12px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;transition:transform .4s}
  .swap:hover{transform:rotate(180deg)}
  .field{position:relative}
  .loc{position:absolute;right:8px;top:30px;border:none;background:transparent;font-size:18px;cursor:pointer}
  .primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.4)}
  .primary:active{transform:scale(.98)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--chip);color:var(--chipt);border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .chip:hover{filter:brightness(.95)}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:18px;color:#fff;flex-wrap:wrap}
  .toolbar .chip{background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
  .toolbar .chip.on{background:#fff;color:#1e40af}
  .res{animation:rise .5s ease both;cursor:pointer;transition:transform .2s}
  .res.noanim{animation:none}
  .res:hover{transform:translateY(-3px)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{background:var(--chip);color:var(--chipt);padding:5px 10px;border-radius:8px;font-weight:800}
  .best{background:#16a34a;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;margin-left:6px}
  .time{font-size:22px;font-weight:800}
  .star{background:none;border:none;font-size:22px;cursor:pointer;width:auto;margin:0;padding:0 4px}
  .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 6px;background:#cbd5e1}
  .bar span{display:block;transition:width .9s cubic-bezier(.2,.8,.2,1);width:0}
  .w{background:#f59e0b}.b{background:#2563eb}
  .legend{font-size:12px;color:var(--muted)}
  .details{max-height:0;overflow:hidden;transition:max-height .45s ease}
  .res.open .details{max-height:520px}
  .tl{list-style:none;margin:14px 0 0;padding:0 0 0 18px;border-left:3px solid var(--accent)}
  .tl li{margin:0 0 12px;position:relative;font-size:14px}
  .tl li::before{content:"";position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff}
  .cmp{font-size:13px;margin-top:10px;color:var(--muted)}
  .spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:#dc2626;font-weight:600}
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding:14px 20px}
  .status .clock{font-size:26px;font-weight:800}
  .status .sub{font-size:12px;color:var(--muted)}
  .pill{border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800;color:#fff}
  .wx{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px;padding:16px 20px}
  .wx .big{font-size:52px;font-weight:800;line-height:1}
  .wx .ico{font-size:52px;line-height:1;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-5px)}}
  .wx .meta{flex:1;min-width:180px;font-size:14px;color:var(--muted)}
  .wx .meta b{color:var(--text);font-size:16px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#16a34a;letter-spacing:.5px}
  .live i{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}100%{box-shadow:0 0 0 10px rgba(22,163,74,0)}}
  .wx .chip{border-radius:10px}
  .strip{flex-basis:100%;display:flex;gap:6px;border-top:1px solid rgba(100,116,139,.25);padding-top:12px}
  .strip .hr{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .strip .t{font-weight:800;color:var(--text);font-size:14px}
  .strip .tb{height:46px;display:flex;align-items:flex-end;justify-content:center;margin:4px 0}
  .strip .tb span{display:block;width:60%;max-width:26px;border-radius:5px 5px 0 0;transition:height .8s}
  .wx .meta a{color:var(--accent)}
  .deptemp{font-size:13px;margin-top:4px;color:var(--muted)}
  .foot{color:#fff;font-size:12px;text-align:center;margin-top:22px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e5fd0"/><stop offset=".55" stop-color="#7fb8f5"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b1f"/><stop offset=".6" stop-color="#14265a"/><stop offset="1" stop-color="#6b3d6e"/></linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7fb5"/><stop offset="1" stop-color="#2c4a7c"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset="1" stop-color="#0b1d3a"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff7d6"/><stop offset=".4" stop-color="#ffd166" stop-opacity=".9"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#day)" class="dayonly"/>
  <rect width="1920" height="1080" fill="url(#night)" class="nightonly"/>
  <circle cx="1500" cy="330" r="230" fill="url(#sun)" class="dayonly"/>
  <g class="nightonly" fill="#fff">
    <circle cx="1500" cy="260" r="55" fill="#f1f5f9"/><circle cx="1522" cy="248" r="50" fill="#14265a"/>
    <circle cx="200" cy="120" r="2"/><circle cx="480" cy="210" r="2.5"/><circle cx="760" cy="90" r="2"/><circle cx="1010" cy="170" r="3"/><circle cx="1260" cy="80" r="2"/><circle cx="1700" cy="150" r="2.5"/><circle cx="90" cy="300" r="2"/><circle cx="900" cy="300" r="2"/>
  </g>
  <g class="dayonly" fill="#fff" opacity=".85">
    <g class="cloud"><ellipse cx="200" cy="220" rx="110" ry="32"/><ellipse cx="270" cy="200" rx="80" ry="34"/><ellipse cx="140" cy="205" rx="70" ry="28"/></g>
    <g class="cloud c2"><ellipse cx="600" cy="140" rx="130" ry="36"/><ellipse cx="680" cy="120" rx="90" ry="34"/></g>
  </g>
  <path d="M0 760 L0 640 h90 v-60 h70 v70 h80 v-110 h60 v110 h110 v-80 h90 v90 h120 v-140 h50 v140 h140 v-70 h100 v80 h130 v-100 h70 v100 h120 v-60 h90 v70 h150 v-120 h60 v120 h110 v-50 h100 v60 h100 V760 Z" fill="url(#far)" opacity=".75"/>
  <g transform="translate(1000 520)">
    <rect x="-130" y="40" width="260" height="220" fill="#8a4b3a"/>
    <rect x="-150" y="20" width="300" height="30" fill="#a05b47"/>
    <rect x="-110" y="0" width="220" height="24" fill="#a05b47"/>
    <path d="M-55 260 V130 a55 55 0 0 1 110 0 V260 Z" fill="#14265a"/>
    <rect x="-70" y="-14" width="140" height="16" fill="#a05b47"/>
    <rect x="-40" y="-30" width="80" height="18" fill="#8a4b3a"/>
  </g>
  <path d="M0 800 L0 700 h120 v-90 h60 v90 h100 v-130 h80 v130 h120 v-60 h110 v60 h90 v-170 h40 v-60 h30 v60 h40 v170 h150 v-80 h100 v80 h130 v-120 h70 v120 h120 v-70 h110 v70 h140 v-110 h60 v110 h90 V800 Z" fill="#1b3a66"/>
  <g class="nightonly" fill="#ffd166" opacity=".9">
    <rect x="130" y="630" width="8" height="10"/><rect x="150" y="660" width="8" height="10"/><rect x="310" y="610" width="8" height="10"/><rect x="330" y="650" width="8" height="10"/><rect x="700" y="640" width="8" height="10"/><rect x="740" y="680" width="8" height="10"/><rect x="1380" y="640" width="8" height="10"/><rect x="1560" y="620" width="8" height="10"/><rect x="1610" y="670" width="8" height="10"/><rect x="1790" y="650" width="8" height="10"/>
  </g>
  <path d="M0 860 L0 790 h160 v-70 h110 v70 h200 v-100 h130 v100 h260 v-60 h120 v60 h300 v-90 h140 v90 h200 v-70 h130 v70 h270 V860 Z" fill="url(#near)"/>
  <rect y="860" width="1920" height="220" fill="#1f2937"/>
  <rect y="855" width="1920" height="10" fill="#475569"/>
  <g stroke="#fbbf24" stroke-width="6" stroke-dasharray="60 40"><line x1="0" y1="975" x2="1920" y2="975"/></g>
  <g class="bus" transform="translate(0 0)">
    <g transform="translate(0 880)">
      <rect width="230" height="80" rx="10" fill="#16a34a"/><rect y="52" width="230" height="10" fill="#fbbf24"/>
      <g fill="#bae6fd"><rect x="12" y="12" width="36" height="28" rx="3"/><rect x="56" y="12" width="36" height="28" rx="3"/><rect x="100" y="12" width="36" height="28" rx="3"/><rect x="144" y="12" width="36" height="28" rx="3"/><rect x="188" y="10" width="34" height="34" rx="3"/></g>
      <circle cx="50" cy="82" r="16" fill="#111827"/><circle cx="180" cy="82" r="16" fill="#111827"/><circle cx="50" cy="82" r="6" fill="#9ca3af"/><circle cx="180" cy="82" r="6" fill="#9ca3af"/>
    </g>
  </g>
  <rect width="1920" height="1080" fill="#0b1d3a" opacity=".12"/>
</svg>
</div>

<div class="wrap">
  <header>
    <h1>🚌 Delhi Bus Journey Planner</h1>
    <button class="icon-btn" id="theme" type="button" title="Cycle Auto / Day / Night">🌗 Auto</button>
  </header>

  <div class="card status" id="status">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="sub" id="clockSub">&nbsp;</div>
    </div>
    <div id="trafficPill" class="pill" style="background:#64748b">🚦 Traffic…</div>
    <div class="sub" id="trafficSub" style="flex:1;min-width:180px"></div>
  </div>

  <div class="card wx" id="wx">
    <div class="ico" id="wxIco">⏳</div>
    <div><div class="big" id="wxTemp">--°</div></div>
    <div class="meta" id="wxMeta">Loading live temperature…</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="chip" id="unit" type="button">°C / °F</button>
      <button class="chip" id="wxLoc" type="button">📍 My location</button>
    </div>
    <div class="strip" id="wxStrip"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="from">Origin (type to see Delhi stops)</label>
        <input id="from" list="stops" value="Begum Pur (Kanjhawala Road)" autocomplete="off" placeholder="e.g. Kashmere Gate, Begum Pur...">
        <button class="loc" type="button" id="locBtn" title="Use my location">📍</button>
      </div>
      <button class="swap" id="swap" type="button" title="Swap">⇄</button>
      <div>
        <label for="to">Destination (type to see Delhi stops)</label>
        <input id="to" list="stops" value="Rithala Village" autocomplete="off" placeholder="e.g. Nehru Place, Rithala Village...">
      </div>
    </div>
    <datalist id="stops"></datalist>
    <div class="row">
      <div>
        <label for="depart">Leave at <span id="liveTag" style="color:#16a34a"></span></label>
        <input id="depart" type="datetime-local">
      </div>
      <div style="flex:0 0 120px">
        <label>&nbsp;</label>
        <button class="chip" id="now" type="button" style="width:100%;padding:13px;margin:5px 0 12px;border-radius:10px">⏱ Now (live)</button>
      </div>
    </div>
    <button class="primary" id="go" type="button">Find Buses</button>
    <div class="chips" id="recent"></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    Sort:
    <button class="chip on" data-sort="total_time_min" type="button">⚡ Fastest</button>
    <button class="chip" data-sort="walk" type="button">🚶 Least walking</button>
    <button class="chip" data-sort="delay" type="button">🚦 Least traffic delay</button>
  </div>
  <div id="results"></div>
  <div class="foot">Powered by Delhi GTFS Static Network & Historical Bus Speed Profiles (IST).</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let options = [];
  let sortKey = 'total_time_min';
  let liveMode = true;
  let openRoutes = new Set();

  /* ---------- storage (safe) ---------- */
  const store = {
    get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v } catch(e){ return d } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(2, '0');

  /* ---------- live stop autocomplete from FastAPI /stops ---------- */
  let suggestTimer;
  async function updateStopSuggestions(q) {
    if (q.trim().length < 2) return;
    try {
      const resp = await fetch(`/stops?q=${encodeURIComponent(q.trim())}`);
      if (!resp.ok) return;
      const names = await resp.json();
      if (names.length) {
        $('stops').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
      }
    } catch (e) {}
  }
  ['from', 'to'].forEach(id => {
    $(id).addEventListener('input', e => {
      clearTimeout(suggestTimer);
      suggestTimer = setTimeout(() => updateStopSuggestions(e.target.value), 180);
    });
  });

  /* ---------- theme: auto day/night ---------- */
  const SUN = [[430,1070],[415,1100],[390,1115],[360,1135],[335,1155],[325,1170],[335,1165],[355,1145],[370,1110],[385,1080],[410,1055],[430,1050]];
  let themeMode = store.get('themeMode', 'auto');
  function isNightNow(){
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), [rise, set] = SUN[d.getMonth()];
    return m < rise || m >= set;
  }
  function applyTheme(){
    const dark = themeMode === 'night' || (themeMode === 'auto' && isNightNow());
    document.body.classList.toggle('dark', dark);
    $('theme').textContent = themeMode === 'auto' ? (dark ? '🌗 Auto · Night' : '🌗 Auto · Day')
      : themeMode === 'day' ? '☀️ Day' : '🌙 Night';
  }
  $('theme').onclick = () => {
    themeMode = themeMode === 'auto' ? 'day' : themeMode === 'day' ? 'night' : 'auto';
    store.set('themeMode', themeMode); applyTheme();
  };

  /* ---------- status bar (clock + traffic indicator) ---------- */
  function trafficLevel(date){
    const m = date.getHours() * 60 + date.getMinutes();
    if ((m >= 480 && m < 660) || (m >= 1020 && m < 1260)) return {label: 'Peak / Heavy', color: '#dc2626', icon: '🔴', sp: 14};
    if (m >= 660 && m < 1020) return {label: 'Moderate', color: '#d97706', icon: '🟡', sp: 18};
    if (m >= 1320 || m < 360) return {label: 'Light (Quiet)', color: '#16a34a', icon: '🟢', sp: 26};
    return {label: 'Normal', color: '#2563eb', icon: '🔵', sp: 21};
  }
  function updateStatus(){
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
    $('clockSub').textContent = now.toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'short'});
    const t = trafficLevel(now), p = $('trafficPill');
    p.textContent = t.icon + ' Traffic: ' + t.label; p.style.background = t.color;
    $('trafficSub').textContent = 'Model calibrated on Delhi GPS historical pings · typical speed ~' + t.sp + ' km/h';
  }

  /* ---------- inputs ---------- */
  $('swap').onclick = () => {
    const f = $('from').value; $('from').value = $('to').value; $('to').value = f;
    if (options.length) searchJourneys();
  };
  function setDepartNow(){
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    $('depart').value = d.toISOString().slice(0, 16);
  }
  function setLive(on){
    liveMode = on;
    $('liveTag').textContent = on ? '● live' : '';
    if (on) setDepartNow();
  }
  $('now').onclick = () => { setLive(true); if (options.length) searchJourneys(); };
  $('depart').addEventListener('input', () => setLive(false));
  $('depart').addEventListener('change', () => { setLive(false); if (options.length) searchJourneys(); });
  $('locBtn').onclick = () => {
    if (!navigator.geolocation) return alert('Geolocation not supported');
    navigator.geolocation.getCurrentPosition(
      p => $('from').value = p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5),
      () => alert('Could not get your location')
    );
  };
  document.querySelectorAll('#from,#to,#depart').forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') searchJourneys(); }));
  $('go').onclick = () => searchJourneys();

  function renderRecent(){
    const r = store.get('recent', []);
    $('recent').innerHTML = r.map((x,i) => `<button class="chip" type="button" data-i="${i}">${x.fav ? '⭐' : '🕘'} ${esc(x.from)} → ${esc(x.to)}</button>`).join('');
    $('recent').querySelectorAll('button').forEach(b => b.onclick = () => {
      const x = store.get('recent', [])[b.dataset.i];
      $('from').value = x.from; $('to').value = x.to; searchJourneys();
    });
  }
  function remember(from, to){
    let r = store.get('recent', []).filter(x => !(x.from === from && x.to === to));
    const wasFav = store.get('favs', []).some(k => k.startsWith(from + '|' + to + '|'));
    r.unshift({from, to, fav: wasFav}); store.set('recent', r.slice(0, 5)); renderRecent();
  }

  /* ---------- backend API search (/journeys) ---------- */
  async function searchJourneys(silent){
    silent = silent === true;
    const from = $('from').value.trim(), to = $('to').value.trim();
    if (!silent) $('toolbar').style.display = 'none';
    if (!from || !to) { $('results').innerHTML = '<div class="card err">Please enter both origin and destination.</div>'; return; }
    if (liveMode) setDepartNow();
    if (!$('depart').value) setDepartNow();

    const departVal = $('depart').value;
    const departIso = departVal.length === 16 ? departVal + ':00' : departVal;

    if (!silent) {
      openRoutes.clear();
      $('results').innerHTML = '<div class="spin"></div><p style="text-align:center;color:#fff">Querying Delhi GTFS routes & historical speeds…</p>';
    }
    $('go').disabled = true;

    try {
      const resp = await fetch(`/journeys?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&depart=${encodeURIComponent(departIso)}`);
      const data = await resp.json();
      $('go').disabled = false;

      if (!resp.ok) {
        options = [];
        $('results').innerHTML = `<div class="card err">${esc(data.detail || 'Could not find routes for those stops.')}</div>`;
        return;
      }

      options = data.journey_options || [];
      if (!silent) remember(from, to);

      if (!options.length) {
        $('results').innerHTML = '<div class="card">No direct bus routes found between these stops. Try picking a stop from the suggestions as you type.</div>';
        return;
      }

      renderResults(from, to, !silent, new Date(departIso).getTime());
    } catch (e) {
      $('go').disabled = false;
      options = [];
      $('results').innerHTML = '<div class="card err">Could not reach the backend server. Make sure FastAPI is running.</div>';
    }
  }

  /* ---------- render results ---------- */
  function sorted(){
    const v = o => sortKey === 'walk' ? (o.walk_to_stop_min + o.walk_to_dest_min)
                  : sortKey === 'delay' ? (o.total_time_min - o.quiet_hour_total_min)
                  : o.total_time_min;
    return [...options].sort((a, b) => v(a) - v(b));
  }

  function renderResults(from, to, animate, departMs){
    from = from || $('from').value.trim();
    to = to || $('to').value.trim();
    departMs = departMs || new Date($('depart').value).getTime();
    $('toolbar').style.display = 'flex';
    const favs = store.get('favs', []);
    const list = sorted();

    $('results').innerHTML = list.map((o, i) => {
      const walk = +(o.walk_to_stop_min + o.walk_to_dest_min).toFixed(1);
      const tot = o.total_time_min || 1;
      const delay = Math.max(0, +(o.total_time_min - o.quiet_hour_total_min).toFixed(1));
      const fav = favs.includes(from + '|' + to + '|' + o.route);
      const open = openRoutes.has(o.route) ? ' open' : '';
      const anim = animate ? `style="animation-delay:${i*90}ms"` : '';
      const reachMs = departMs + tot * 60000;
      const reachStr = new Date(reachMs).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});

      return `
      <div class="card res${open}${animate ? '' : ' noanim'}" ${anim} data-route="${esc(o.route)}">
        <div class="top">
          <div><span class="badge">Route ${esc(o.route)}</span>${i === 0 ? '<span class="best">BEST</span>' : ''}</div>
          <div><span class="time">${o.total_time_min} min</span>
            <button class="star" type="button" data-fav="${esc(o.route)}" title="Save route">${fav ? '⭐' : '☆'}</button></div>
        </div>
        <div class="legend" style="margin-top:6px">Estimated arrival around <b>${reachStr}</b> · <b>${esc(o.boarding_stop)}</b> → <b>${esc(o.alighting_stop)}</b></div>
        <div class="bar">
          <span class="w" data-w="${o.walk_to_stop_min / tot * 100}"></span>
          <span class="b" data-w="${o.bus_ride_min / tot * 100}"></span>
          <span class="w" data-w="${o.walk_to_dest_min / tot * 100}"></span>
        </div>
        <div class="legend">🟧 walking ${walk} min &nbsp; 🟦 bus ${o.bus_ride_min} min at ~${o.predicted_speed_kmph} km/h</div>
        <div class="cmp">${delay > 0 ? `🚦 Traffic adds <b>${delay} min</b> vs. quiet hour (${o.quiet_hour_total_min} min)` : `✅ Roads are clear (quiet-hour total: ${o.quiet_hour_total_min} min)`}</div>
        <div class="details">
          <ul class="tl">
            <li>Walk <b>${o.walk_to_stop_min} min</b> to <b>${esc(o.boarding_stop)}</b></li>
            <li>Board bus <b>${esc(o.route)}</b> and ride <b>${o.bus_ride_min} min</b> (~${o.predicted_speed_kmph} km/h)</li>
            <li>Get off at <b>${esc(o.alighting_stop)}</b></li>
            <li>Walk <b>${o.walk_to_dest_min} min</b> to your destination</li>
          </ul>
        </div>
        ${depTempHTML(departMs)}
        <div class="legend" style="margin-top:8px">Tap card for step-by-step ▾</div>
      </div>`;
    }).join('');

    requestAnimationFrame(() => setTimeout(() =>
      document.querySelectorAll('.bar span').forEach(s => s.style.width = s.dataset.w + '%'), animate ? 60 : 0));

    document.querySelectorAll('.res').forEach(c => c.onclick = e => {
      if (e.target.closest('.star')) return;
      c.classList.toggle('open');
      c.classList.contains('open') ? openRoutes.add(c.dataset.route) : openRoutes.delete(c.dataset.route);
    });
    document.querySelectorAll('.star').forEach(s => s.onclick = () => {
      const key = from + '|' + to + '|' + s.dataset.fav;
      let f = store.get('favs', []);
      f = f.includes(key) ? f.filter(x => x !== key) : [...f, key];
      store.set('favs', f);
      s.textContent = f.includes(key) ? '⭐' : '☆';
    });
  }

  document.querySelectorAll('#toolbar .chip').forEach(b => b.onclick = () => {
    document.querySelectorAll('#toolbar .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); sortKey = b.dataset.sort; renderResults(null, null, false);
  });

  /* ---------- live weather: several sources + fallbacks ---------- */
  const WX = {0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
    45:['Fog','🌫️'],48:['Rime fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],
    61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],80:['Showers','🌦️'],81:['Showers','🌧️'],
    82:['Violent showers','⛈️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm & hail','⛈️'],99:['Thunderstorm & hail','⛈️']};
  let wx = null, place = {lat:28.6139, lon:77.2090, label:'Delhi'}, unit = store.get('unit', 'C');
  const conv = c => unit === 'C' ? Math.round(c) : Math.round(c * 9 / 5 + 32);
  const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;

  function timedFetch(url, ms = 7000){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    return fetch(url, {signal: ctl.signal}).then(r => {
      clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    }, e => { clearTimeout(t); throw e; });
  }
  function iconFor(desc, hr){
    const s = (desc || '').toLowerCase(), night = hr < 6 || hr >= 19;
    if (/thunder/.test(s)) return '⛈️';
    if (/rain|shower|drizzle/.test(s)) return '🌧️';
    if (/fog|mist|haze|smoke/.test(s)) return '🌫️';
    if (/overcast|cloudy/.test(s)) return /partly/.test(s) ? '⛅' : '☁️';
    return night ? '🌙' : '☀️';
  }
  async function srcOpenMeteo(){
    const d = await timedFetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}`
      + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day`
      + `&hourly=temperature_2m&timezone=auto&forecast_days=3`);
    if (!d.current) throw new Error('bad data');
    return {current: d.current, hourly: d.hourly, source: 'Open-Meteo'};
  }
  async function srcWttr(){
    const d = await timedFetch(`https://wttr.in/${place.lat},${place.lon}?format=j1`);
    const c = d.current_condition[0], desc = c.weatherDesc[0].value, hr = new Date().getHours();
    const hourly = {time: [], temperature_2m: []};
    d.weather.forEach(day => day.hourly.forEach(h => {
      hourly.time.push(`${day.date}T${pad(Math.floor(+h.time / 100))}:00`); hourly.temperature_2m.push(+h.tempC);
    }));
    return {current: {temperature_2m: +c.temp_C, apparent_temperature: +c.FeelsLikeC, relative_humidity_2m: +c.humidity,
      wind_speed_10m: +c.windspeedKmph, weather_code: null, desc, icon: iconFor(desc, hr), is_day: hr >= 6 && hr < 19 ? 1 : 0},
      hourly, source: 'wttr.in'};
  }
  function estimate(){
    const hi = [21,24,30,37,41,40,35,34,34,33,28,23], lo = [8,11,16,22,26,28,27,26,24,18,12,8];
    const f = (m, h) => (hi[m] + lo[m]) / 2 + (hi[m] - lo[m]) / 2 * Math.sin((h - 9) / 24 * 2 * Math.PI);
    const now = new Date(), hourly = {time: [], temperature_2m: []};
    for (let i = 0; i < 48; i++){
      const d = new Date(now.getTime() + i * 3600e3);
      hourly.time.push(isoLocal(d)); hourly.temperature_2m.push(f(d.getMonth(), d.getHours()));
    }
    const t = f(now.getMonth(), now.getHours()), hr = now.getHours();
    return {current: {temperature_2m: t, apparent_temperature: t, relative_humidity_2m: null, wind_speed_10m: null,
      weather_code: null, desc: 'Typical for this time of year', icon: hr < 6 || hr >= 19 ? '🌙' : '🌡️', is_day: hr >= 6 && hr < 19 ? 1 : 0},
      hourly, source: 'estimate'};
  }

  async function loadWeather(){
    $('wxMeta').innerHTML = '<span class="live"><i></i>Fetching live temperature…</span>';
    const errs = [];
    for (const [name, fn] of [['Open-Meteo', srcOpenMeteo], ['wttr.in', srcWttr]]){
      try {
        const d = await fn();
        wx = {...d, fetchedAt: new Date(), mode: 'live'};
        store.set('wxcache', {d, t: Date.now(), lat: place.lat});
        renderWeather(); return;
      } catch (e) { errs.push(name + ': ' + (e.name === 'AbortError' ? 'timeout' : e.message)); }
    }
    const c = store.get('wxcache', null);
    if (c && c.lat === place.lat && Date.now() - c.t < 3 * 3600e3) wx = {...c.d, fetchedAt: new Date(c.t), mode: 'cached'};
    else wx = {...estimate(), fetchedAt: new Date(), mode: 'estimate'};
    wx.errs = errs; renderWeather();
  }

  function tempColor(c){ return c < 15 ? '#3b82f6' : c < 28 ? '#16a34a' : c < 38 ? '#f59e0b' : '#dc2626'; }
  function renderWeather(){
    if (!wx) return;
    const c = wx.current, info = WX[c.weather_code] || ['', '🌡️'];
    const desc = c.desc || info[0], icon = c.icon || ((!c.is_day && c.weather_code <= 1) ? '🌙' : info[1]);
    $('wxIco').textContent = icon;
    $('wxTemp').textContent = conv(c.temperature_2m) + '°' + unit;
    $('wxTemp').style.color = tempColor(c.temperature_2m);
    const badge = wx.mode === 'live' ? '<span class="live"><i></i>LIVE</span>'
      : wx.mode === 'cached' ? '<span class="live" style="color:#d97706">CACHED</span>'
      : '<span class="live" style="color:#d97706">ESTIMATE</span>';
    const extra = [`Feels like ${conv(c.apparent_temperature)}°`];
    if (c.relative_humidity_2m != null) extra.push(`Humidity ${c.relative_humidity_2m}%`);
    if (c.wind_speed_10m != null) extra.push(`Wind ${Math.round(c.wind_speed_10m)} km/h`);
    const time = wx.fetchedAt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    $('wxMeta').innerHTML = `${badge} &nbsp;<b>${place.label}</b>${desc ? ' · ' + desc : ''}<br>${extra.join(' · ')}<br>`
      + `<small>${wx.mode === 'estimate' ? 'Live weather servers could not be reached. ' : ''}`
      + `${wx.mode === 'live' ? 'Source: ' + wx.source + ' · ' : ''}Updated ${time} · <a href="#" id="retry">Refresh</a></small>`;
    $('retry').onclick = e => { e.preventDefault(); loadWeather(); };
    renderStrip();
    updateStatus();
  }
  function renderStrip(){
    const h = wx.hourly;
    if (!h || !h.time.length) { $('wxStrip').innerHTML = ''; return; }
    const start = h.time.findIndex(t => new Date(t).getTime() >= Date.now() - 3600e3);
    const idx = [], from = Math.max(0, start);
    for (let i = from; i < h.time.length && idx.length < 7; i++) idx.push(i);
    const temps = idx.map(i => h.temperature_2m[i]), mn = Math.min(...temps), mx = Math.max(...temps);
    $('wxStrip').innerHTML = idx.map(i => {
      const t = h.temperature_2m[i], d = new Date(h.time[i]), pct = mx === mn ? 50 : 25 + (t - mn) / (mx - mn) * 75;
      return `<div class="hr"><div class="t">${conv(t)}°</div><div class="tb"><span style="height:${pct}%;background:${tempColor(t)}"></span></div>`
        + `<div>${d.toLocaleTimeString([], {hour: 'numeric'})}</div></div>`;
    }).join('');
  }
  function tempAt(ms){
    if (!wx || !wx.hourly || !wx.hourly.time.length) return null;
    let best = -1, diff = Infinity;
    wx.hourly.time.forEach((t, i) => { const d = Math.abs(new Date(t).getTime() - ms); if (d < diff) { diff = d; best = i; } });
    return best < 0 || diff > 100 * 60e3 ? null : conv(wx.hourly.temperature_2m[best]);
  }
  function depTempHTML(ms){
    const t = tempAt(ms);
    return t === null ? '' : `<div class="deptemp">🌡️ Expected <b>${t}°${unit}</b> at departure${wx.mode === 'estimate' ? ' (estimate)' : ''}</div>`;
  }
  $('unit').onclick = () => { unit = unit === 'C' ? 'F' : 'C'; store.set('unit', unit); renderWeather(); if (options.length) renderResults(null, null, false); };
  $('wxLoc').onclick = () => {
    if (!navigator.geolocation) return alert('Geolocation not supported');
    navigator.geolocation.getCurrentPosition(p => {
      place = {lat: p.coords.latitude, lon: p.coords.longitude, label: 'Your location'};
      loadWeather();
    }, () => alert('Could not get your location'));
  };

  /* ---------- start + automatic updates ---------- */
  applyTheme(); updateStatus(); setLive(true); renderRecent(); loadWeather();
  setInterval(() => { applyTheme(); updateStatus(); }, 15 * 1000);
  setInterval(() => { if (liveMode && options.length) searchJourneys(true); }, 30 * 1000);
  setInterval(loadWeather, 10 * 60 * 1000);
  searchJourneys();
</script>
</body>
</html>
